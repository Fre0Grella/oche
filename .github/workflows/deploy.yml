name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The app needs an HTTPS origin: browsers refuse camera access outside a secure
# context, and phone↔laptop pairing needs both devices on the same origin.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The newest published model release goes into the site itself: the app
      # loads it from its own origin (release downloads send no CORS headers,
      # so a browser could not fetch them directly anyway). The file name
      # carries the hash and the manifest the full SHA-256, which the app checks.
      # No model release yet is fine: the app works without one.
      - name: Add the latest published model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 100 --json tagName,isDraft,isPrerelease,publishedAt \
            --jq '[.[] | select((.tagName | startswith("model-")) and (.isDraft | not) and (.isPrerelease | not))] | sort_by(.publishedAt) | last | .tagName // empty')
          if [ -z "$tag" ]; then echo "no published model release: deploying without a model"; exit 0; fi
          name="${tag#model-}"
          gh release download "$tag" --pattern "$name.onnx" --dir "$RUNNER_TEMP/model"
          sha=$(sha256sum "$RUNNER_TEMP/model/$name.onnx" | cut -d' ' -f1)
          card="ml/models/$name/CARD.md"
          if [ -f "$card" ] && ! grep -q "$sha" "$card"; then echo "::error::$tag does not match $card"; exit 1; fi
          file="$name-${sha:0:12}.onnx"
          mkdir -p apps/web/dist/models
          cp "$RUNNER_TEMP/model/$name.onnx" "apps/web/dist/models/$file"
          # Datasets that have to be credited wherever the model is used.
          deepdarts=false
          dartscribe=false
          if [ -f "$card" ] && grep -q "DeepDarts: yes" "$card"; then deepdarts=true; fi
          if [ -f "$card" ] && grep -q "dartscribe: yes" "$card"; then dartscribe=true; fi
          printf '{"name":"%s","file":"%s","sha256":"%s","deepdarts":%s,"dartscribe":%s}\n' "$name" "$file" "$sha" "$deepdarts" "$dartscribe" > apps/web/dist/models/manifest.json
          echo "shipping $tag as models/$file"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
